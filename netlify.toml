# Goal Garden — browser app on Netlify (Next.js)
# Connect this GitHub repo in Netlify → auto-deploys on every push.
# Custom domain: garden.bambootide.org → this site

[build]
  command = "npm run build"
  # @netlify/plugin-nextjs sets the publish directory automatically

[build.environment]
  NODE_VERSION = "20"
  # Production = real accounts. Set these in Netlify UI → Environment variables:
  #   NEXT_PUBLIC_SUPABASE_URL
  #   NEXT_PUBLIC_SUPABASE_ANON_KEY
  #   NEXT_PUBLIC_PREMIUM_CHECKOUT_URL  (Lemon Squeezy / Stripe link for $7.99)
  # Do NOT set NEXT_PUBLIC_DEMO_MODE=true on production.
  NEXT_PUBLIC_DEMO_MODE = "false"
  NEXT_PUBLIC_SITE_URL = "https://garden.bambootide.org"
  NEXT_PUBLIC_MARKETING_URL = "https://bambootide.org/apps/goal-garden/"

# Netlify Next.js Runtime (OpenNext adapter is auto-detected on modern Netlify)
[[plugins]]
  package = "@netlify/plugin-nextjs"
